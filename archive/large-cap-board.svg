  <rect x="420" y="105" width="55" height="30" fill="#fff" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="447" y="124" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">C8</text>
  <text x="447" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">470uF/450V</text>

  <rect x="420" y="155" width="55" height="30" fill="#fff" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="447" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">C9</text>
