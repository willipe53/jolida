  <text x="525" y="368" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">tag 17 / ~ -54V</text>

  <rect x="600" y="330" width="55" height="36" fill="#fff" stroke="#333" stroke-width="1.5" rx="3"/>
  <text x="627" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">C10</text>
  <text x="627" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">220uF/160V</text>

