  <text x="75" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">T2 HV</text>
  <text x="75" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#666">AC IN</text>

