  <line x1="375" y1="348" x2="410" y2="348" stroke="#333" stroke-width="1.5"/>
  <line x1="655" y1="348" x2="655" y2="400" stroke="#333" stroke-width="1.5"/>
  <line x1="655" y1="400" x2="510" y2="400" stroke="#333" stroke-width="1.5"/>
